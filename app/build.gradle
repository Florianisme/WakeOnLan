apply plugin: 'com.android.application'
apply from: "$rootProject.projectDir/shared-build.gradle"

android {
    defaultConfig {
        versionCode 111
        wearAppUnbundled true
    }
    buildFeatures {
        dataBinding true
    }

    packaging {
        resources {
            excludes += 'META-INF/LICENSE.md'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'

    implementation 'org.reactivestreams:reactive-streams:1.0.4'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'

    implementation "androidx.core:core:1.19.0"
    implementation 'androidx.core:core-google-shortcuts:1.1.0'

    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'

    // SSH
    implementation 'com.hierynomus:sshj:0.40.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'

    implementation project(path: ':shared-models')
    implementation project(path: ':ping')

    // Kotlin BOM
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.0.0"))
}