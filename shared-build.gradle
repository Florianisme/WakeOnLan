android {
    namespace 'de.florianisme.wakeonlan'
    compileSdk 37

    signingConfigs {
        release {
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Sign the release build only when a keystore is provided via env vars
            // (e.g. in CI). Local builds without it stay unsigned.
            if (System.getenv("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled true
            shrinkResources true
        }
    }

    defaultConfig {
        applicationId "de.florianisme.wakeonlan"
        minSdk 25
        targetSdk 37
        versionName "2.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.google.android.support.wearable
    compileOnly libs.google.android.wearable.api
    implementation libs.google.play.services.wearable

    implementation libs.google.guava

    implementation libs.google.gson

    testImplementation libs.junit
    testImplementation libs.mockito
}