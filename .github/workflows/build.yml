name: Java CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build unsigned release APK and AAB
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew --parallel --max-workers=8 \
            :app:assembleRelease :app:bundleRelease \
            :wear:assembleRelease :wear:bundleRelease
      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload wear APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-release-apk
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload app AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload wear AAB
        uses: actions/upload-artifact@v4
        with:
          name: wear-release-aab
          path: wear/build/outputs/bundle/release/*.aab
          if-no-files-found: error

